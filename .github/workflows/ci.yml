name: CI
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install beautifulsoup4 numpy rank-bm25 "mcp>=2.3,<3" pytest ruff
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install sentence-transformers
      - run: ruff check .
      - run: pytest -q
